<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ABALONE ONLINE</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><a href="https://bordersaba.github.io/">HOME</a><a href="https://bordersaba.github.io/#records">プレイ記録</a></div><b>ABALONE ONLINE</b><small>v0.1.0</small></header>
<main><section id="lobby"><h1>ABALONE ONLINE</h1><p>球を押し、相手の球を6個盤外へ落とせば勝利</p><label>プレイヤー名<input id="name" maxlength="16"></label><div class="rooms" id="rooms"></div><div class="cpuBox"><button id="cpuStart">CPUと対戦</button></div><p class="note">黒が先手です。自分の球を1～3個選び、緑色の移動先を押してください。</p></section>
<section id="game" hidden><div class="gameTop"><button id="leave">退出</button><div id="status"></div><button id="resetGame">投了</button></div><div class="score"><span id="blackScore">● 黒 0/6</span><span id="whiteScore">○ 白 0/6</span></div><div id="board"></div><div class="help" id="help">球を選択してください</div></section></main>
<script src="app.js"></script></body></html>
