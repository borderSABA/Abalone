<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ABALONE ONLINE</title><link rel="stylesheet" href="style.css"></head><body>
<header><div></div><b>ABALONE ONLINE</b><small>v0.2.1</small></header>
<main><section id="lobby"><h1>ABALONE ONLINE</h1><p>球を押し、相手の球を6個盤外へ落とせば勝利</p><label>プレイヤー名<input id="name" maxlength="16"></label><div class="rooms" id="rooms"></div><div class="cpuBox"><button id="cpuStart">CPUと対戦</button></div><p class="note">黒が先手です。自分の球を1～3個選び、緑色の移動先を押してください。</p></section>
<section id="roomLobby" hidden><h1 id="roomTitle">ROOM</h1><div class="waitingCard"><h2>対戦ロビー</h2><div id="lobbyPlayers"></div><div id="hostSettings" hidden><label>先攻設定<select id="firstMode"><option value="random">ランダム</option><option value="host">ホストが先攻</option><option value="guest">参加者が先攻</option></select></label><button id="startOnline">ゲーム開始</button></div><p id="waitingText">参加者を待っています…</p><button id="leaveLobby">ROOMから退出</button></div></section>
<section id="game" hidden><div class="gameTop"><button id="leave">退出</button><div id="status"></div><button id="resetGame">投了</button></div><div class="score"><span id="blackScore">● 黒 0/6</span><span id="whiteScore">○ 白 0/6</span></div><div id="board"></div><div class="help" id="help">球を選択してください</div></section><div id="resultModal" class="modal" hidden><div class="modalCard"><h2 id="resultTitle">対戦終了</h2><div class="resultBtns"><button id="rematch">再戦</button><button id="backLobby">ロビーへ戻る</button></div><p id="rematchStatus"></p></div></div></main>
<script src="app.js"></script></body></html>
